<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NextWorld Editor</title>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    { "imports": {
      "three": "https://unpkg.com/three@0.186.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.186.0/examples/jsm/"
    } }
  </script>
</head>
<body class="editor-page">
  <header class="editor-bar">
    <strong>NextWorld Editor</strong>
    <button id="openButton">Open</button><button id="saveButton">Save</button><button id="selectToolButton">Select</button><button id="moveToolButton">Move</button><button id="rotateToolButton">Rotate</button><button id="scaleToolButton">Scale</button><button id="stackToolButton">Stack</button><button id="brushToolButton">Brush</button><button id="duplicateButton">Duplicate</button><span class="terrain-label">Terrain:</span><button id="terrainRaiseButton">Raise</button><button id="terrainLowerButton">Lower</button><button id="terrainSmoothButton">Smooth</button><button id="terrainFlattenButton">Flatten</button><button id="terrainTextureButton" title="Add a PNG texture layer">Add PNG…</button><select id="terrainTextureSelect" title="Choose the terrain texture layer"></select><label class="terrain-texture-scale" title="Higher tiling makes the selected texture appear smaller"><span>Tiling</span><input id="terrainTextureScale" type="number" min="1" max="200" step="1" value="16"></label><button id="terrainRemoveTextureButton" title="Remove the selected terrain texture layer">Remove PNG</button><button id="terrainPaintButton" title="Paint the selected PNG layer on terrain">Paint</button><button id="terrainGrassButton" title="Paint nearby-rendered grass">Grass</button><button id="terrainEraseGrassButton" title="Remove painted grass">Erase Grass</button>
    <span id="editorStatus">Loading world…</span>
  </header>
  <aside id="assetPanel" class="asset-panel">
    <div class="asset-panel__title">World</div>
    <div id="assetTree"></div>
  </aside>
  
  <canvas id="gameCanvas"></canvas>
  <script type="module" src="js/app/editor-main.js"></script>
</body>
</html>
