<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1">

    <title>7M Triangle Mobile Test</title>

    <style>
        html, body {
            margin: 0;
            overflow: hidden;
            background: #87a8c7;
            font-family: monospace;
        }

        canvas {
            display: block;
        }

        #stats {
            position: fixed;
            left: 10px;
            top: 10px;
            padding: 10px 12px;
            background: rgba(0,0,0,.7);
            color: white;
            font-size: 14px;
            line-height: 1.5;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>

<body>

<div id="stats">
    Starting...
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
    }
}
</script>

<script type="module">

import * as THREE from "three";


// ------------------------------------------------------------
// CONFIG
// ------------------------------------------------------------

const BLADES_PER_CLUSTER = 50;

// One quad = 2 triangles
const TRIANGLES_PER_CLUSTER = BLADES_PER_CLUSTER * 2;

// 70,000 * 100 = 7,000,000 triangles
const INSTANCE_COUNT = 70000;

const TOTAL_TRIANGLES =
    TRIANGLES_PER_CLUSTER * INSTANCE_COUNT;


// IMPORTANT:
//
// 1.0 is good for testing geometry/vertex throughput.
// Use Math.min(devicePixelRatio, 2) afterward to test
// something closer to the real game.
//
const PIXEL_RATIO = 1.0;


// true = more grass-like
// false = cheaper one-sided geometry
const DOUBLE_SIDED = true;


// ------------------------------------------------------------
// RENDERER
// ------------------------------------------------------------

const renderer = new THREE.WebGLRenderer({
    antialias: false,
    powerPreference: "high-performance"
});

renderer.setPixelRatio(PIXEL_RATIO);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(renderer.domElement);


// ------------------------------------------------------------
// SCENE
// ------------------------------------------------------------

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87a8c7);


// ------------------------------------------------------------
// CAMERA
// ------------------------------------------------------------

const camera = new THREE.PerspectiveCamera(
    65,
    innerWidth / innerHeight,
    0.1,
    300
);

camera.position.set(0, 4, 9);

camera.lookAt(0, 1.5, 0);


// ------------------------------------------------------------
// CREATE ONE GRASS CLUSTER
//
// 50 simple vertical blades
// 100 triangles total
// ------------------------------------------------------------

function createGrassGeometry() {

    const positions = [];
    const indices = [];

    let vertexIndex = 0;

    for (let i = 0; i < BLADES_PER_CLUSTER; i++) {

        // deterministic-ish distribution
        const angle =
            i * 2.399963229728653;

        const radius =
            Math.sqrt((i + 0.5) / BLADES_PER_CLUSTER)
            * 0.48;

        const cx =
            Math.cos(angle) * radius;

        const cz =
            Math.sin(angle) * radius;

        const height =
            0.5 +
            ((i * 17) % 10) * 0.035;

        const width =
            0.025 +
            ((i * 13) % 5) * 0.004;

        const rot =
            angle * 3.17;

        const rx =
            Math.cos(rot) * width;

        const rz =
            Math.sin(rot) * width;

        const leanX =
            Math.sin(angle * 1.7) * 0.08;

        const leanZ =
            Math.cos(angle * 1.3) * 0.08;


        // bottom left
        positions.push(
            cx - rx,
            0,
            cz - rz
        );

        // bottom right
        positions.push(
            cx + rx,
            0,
            cz + rz
        );

        // top left
        positions.push(
            cx - rx + leanX,
            height,
            cz - rz + leanZ
        );

        // top right
        positions.push(
            cx + rx + leanX,
            height,
            cz + rz + leanZ
        );


        indices.push(
            vertexIndex,
            vertexIndex + 1,
            vertexIndex + 2,

            vertexIndex + 2,
            vertexIndex + 1,
            vertexIndex + 3
        );

        vertexIndex += 4;
    }


    const geometry =
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,
            3
        )
    );

    geometry.setIndex(indices);

    geometry.computeBoundingSphere();

    return geometry;
}


// ------------------------------------------------------------
// MATERIAL
//
// Intentionally extremely simple.
// No lights.
// No alpha.
// No textures.
// No wind.
// ------------------------------------------------------------

const material =
    new THREE.MeshBasicMaterial({

        color: 0x4f9636,

        side:
            DOUBLE_SIDED
                ? THREE.DoubleSide
                : THREE.FrontSide,

        depthTest: true,

        depthWrite: true,

        transparent: false
    });


// ------------------------------------------------------------
// INSTANCES
// ------------------------------------------------------------

const geometry =
    createGrassGeometry();

const grass =
    new THREE.InstancedMesh(
        geometry,
        material,
        INSTANCE_COUNT
    );

grass.frustumCulled = false;

grass.instanceMatrix.setUsage(
    THREE.StaticDrawUsage
);

scene.add(grass);


const dummy =
    new THREE.Object3D();


// roughly 265 × 265 instances
const GRID =
    Math.ceil(Math.sqrt(INSTANCE_COUNT));

const SPACING = 0.55;


for (let i = 0; i < INSTANCE_COUNT; i++) {

    const x =
        i % GRID;

    const z =
        Math.floor(i / GRID);


    dummy.position.set(

        (x - GRID / 2) * SPACING,

        0,

        (z - GRID / 2) * SPACING
    );


    // variation
    dummy.rotation.y =
        ((i * 17) % 100) / 100 * Math.PI * 2;


    const scale =
        0.8 +
        ((i * 23) % 100) / 250;

    dummy.scale.set(
        scale,
        scale,
        scale
    );


    dummy.updateMatrix();

    grass.setMatrixAt(
        i,
        dummy.matrix
    );
}

grass.instanceMatrix.needsUpdate = true;


// ------------------------------------------------------------
// GROUND
// ------------------------------------------------------------

const ground =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            200,
            200
        ),

        new THREE.MeshBasicMaterial({
            color: 0x37632c
        })
    );

ground.rotation.x =
    -Math.PI / 2;

ground.position.y =
    -0.01;

scene.add(ground);


// ------------------------------------------------------------
// FPS TEST
// ------------------------------------------------------------

const stats =
    document.getElementById("stats");


let frames = 0;

let lastTime =
    performance.now();

let startTime =
    performance.now();

let fps = 0;

let lowestFPS =
    Infinity;

const samples = [];


// ------------------------------------------------------------
// RENDER LOOP
// ------------------------------------------------------------

function animate() {

    requestAnimationFrame(animate);


    // Keep camera completely static.
    //
    // This is intentional:
    // no grass updates
    // no matrices rebuilt
    // no frustum calculations
    // no allocations caused by gameplay

    renderer.render(
        scene,
        camera
    );


    frames++;

    const now =
        performance.now();

    const elapsed =
        now - lastTime;


    if (elapsed >= 1000) {

        fps =
            frames * 1000 / elapsed;

        lowestFPS =
            Math.min(
                lowestFPS,
                fps
            );

        const seconds =
            (now - startTime) / 1000;

        samples.push(fps);


        stats.innerHTML =

            `Triangles: ${TOTAL_TRIANGLES.toLocaleString()}<br>` +

            `Three.js triangles: ${renderer.info.render.triangles.toLocaleString()}<br>` +

            `Instances: ${INSTANCE_COUNT.toLocaleString()}<br>` +

            `Draw calls: ${renderer.info.render.calls}<br>` +

            `FPS: ${fps.toFixed(1)}<br>` +

            `Lowest FPS: ${lowestFPS.toFixed(1)}<br>` +

            `Frame time: ${(1000 / fps).toFixed(2)} ms<br>` +

            `Time: ${seconds.toFixed(0)} sec<br>` +

            `Pixel ratio: ${PIXEL_RATIO}<br>` +

            `Double sided: ${DOUBLE_SIDED}`;


        console.log(
            `${seconds.toFixed(0)} sec: ` +
            `${fps.toFixed(1)} FPS`
        );


        frames = 0;

        lastTime = now;
    }
}


animate();


// ------------------------------------------------------------
// RESIZE
// ------------------------------------------------------------

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth / innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>

</body>
</html>
