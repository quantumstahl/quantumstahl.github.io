<html>
    <head>
        <title>CatAdventure</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <script type="importmap">
            {
                "imports": {
                    "three": "https://unpkg.com/three@0.186.0/build/three.module.js",
                    "three/addons/": "https://unpkg.com/three@0.186.0/examples/jsm/"

        </script>
        <script src="js/polygon-clipping.umd.min.js"></script>
        <script type="module" src="three-bootstrap.js"></script>
        <script data-classic-src="js/Game7.js"></script>
        <script data-classic-src="js/AssetManager.js"></script>

        <script data-classic-src="AdventureInput.js"></script>
        <script data-classic-src="AdventureMapLoader.js"></script>
        <script data-classic-src="joy.js"></script>
        <script data-classic-src="WorldSolver.js"></script>

        <style>
            
            body {
                margin: 0;
                overflow: hidden;
                user-select:none;
                pointer-events:none;
                -webkit-user-select: none;
                touch-action: none;
                overscroll-behavior: none;
                user-select: none;
                position: fixed;
                inset: 0;
            }

            #gameCanvas {
                width: 100vw;
                height: 100dvh;
                display: block;
                user-select:none;
                pointer-events:none;
                -webkit-user-select: none;
            }
            #canvas2d {
                width: 100vw;
                height: 100dvh;
                display: block;
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: block;
                background: transparent;
                user-select:none;
            pointer-events:auto;
            -webkit-user-select: none;
            }

            #loadingScreen {
                position: fixed;
                inset: 0;
                z-index: 10000;
                display: grid;
                place-items: center;
                overflow: hidden;
                color: #fff7d6;
                background:
                    radial-gradient(circle at 50% 32%, rgba(255, 240, 162, 0.30), transparent 26%),
                    linear-gradient(180deg, #8fb3d9 0%, #7fa6c9 48%, #527d48 49%, #315a35 100%); 
                font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif;
                pointer-events: none;
                transition: opacity 420ms ease, visibility 420ms ease;
            }
            #loadingScreen.is-ready {
                opacity: 0;
                visibility: hidden;
            }
            #titleScreen {
                position: fixed;
                inset: 0;
                z-index: 10001;
                display: grid;
                place-items: end center;
                padding: clamp(28px, 7vh, 74px) 24px;
                box-sizing: border-box;
                overflow: hidden;
                color: #fff8dc;
                background: #101914 url("titlescreen.png") center / cover no-repeat;
                cursor: pointer;
                pointer-events: auto;
                font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif;
                transition: opacity 380ms ease, visibility 380ms ease;
            }
            #titleScreen.is-starting {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }
            @media (orientation: portrait) {
                #titleScreen {
                    background-image: url("titlescreenPortrait.png");
                }
            }
            .loadingCard {
                display: grid;
                justify-items: center;
                gap: 12px;
                padding: 26px 38px;
                border: 1px solid rgba(255, 247, 205, 0.72);
                border-radius: 24px;
                background: rgba(22, 55, 42, 0.48);
                box-shadow: 0 16px 42px rgba(14, 35, 35, 0.28);
                backdrop-filter: blur(5px);
            }
            .loadingPaw {
                width: 48px;
                height: 48px;
                border: 4px solid rgba(255, 237, 151, 0.92);
                border-top-color: #d69a35;
                border-radius: 50%;
                animation: loadingSpin 1s linear infinite;
            }
            .loadingTitle {
                font-size: clamp(25px, 5vw, 38px);
                font-weight: 850;
                letter-spacing: 0.02em;
                text-shadow: 0 2px 0 rgba(42, 71, 43, 0.5);
            }
            #loadingMessage {
                font-size: 14px;
                font-weight: 700;
                color: #ffeaa2;
            }
            @keyframes loadingSpin { to { transform: rotate(360deg); } }
            
            
            
        </style>
        
        
    </head>
    <body>
        <canvas id="gameCanvas"></canvas>
        <canvas id="canvas2d"></canvas>
        <div id="titleScreen" role="button" tabindex="0" aria-label="Start Cat Adventure">

        </div>
        <div id="loadingScreen" role="status" aria-live="polite">
            <div class="loadingCard">
                <div class="loadingPaw" aria-hidden="true"></div>
                <div class="loadingTitle">Cat Adventure</div>
                <div id="loadingMessage">Loading the meadow…</div>
            </div>
        </div>

        <script type="text/plain" data-startup>
            
            var song= 'sounds/PawprintMeadow.mp3';
            
            var audio = new Audio(song);
            audio.loop = true;
            const context = new (window.AudioContext || window.webkitAudioContext)();
            const audio2 = async url => {   
            const source = context.createBufferSource(); 
            const audioBuffer = await fetch(url).then(res => res.arrayBuffer()).then(ArrayBuffer => context.decodeAudioData(ArrayBuffer)); 
            source.buffer = audioBuffer;
            source.connect(context.destination);
            const finished = new Promise(resolve => { source.onended = resolve; });
            source.start();
            return finished;
            };    
            document.addEventListener('click', (event) => {
                try{if(audio.paused){ audio.play();}}catch(error){};
                if(context.state === 'suspended'){context.suspend();context.resume();} 

            });
            document.addEventListener("touchstart" , function(e) {
                e.preventDefault();
                try{if(audio.paused){ audio.play();}}catch(error){};
                if(context.state === 'suspended'){context.suspend();context.resume();}           
            });
            document.addEventListener("visibilitychange", event => {
                if (document.visibilityState === "visible") {
                    audio.pause();
                    audio.src = song;
                    audio.play();
                    context.resume();
                }
                else {audio.pause(); audio.src = "";context.suspend();}
            });
            window.addEventListener("keydown", e => {
                    try{if(audio.paused){ audio.play();}}catch(error){};
                    if(context.state === 'suspended'){context.suspend();context.resume();} 
                
            });
            
            
            document.addEventListener("touchmove", function(e) {
                e.preventDefault();
            }, { passive: false });
            window.addEventListener("touchmove", e => {
                e.preventDefault();
            }, { passive: false });
            
            const isMobile = {Android: function() { return navigator.userAgent.match(/Android/i); },BlackBerry: function() { return navigator.userAgent.match(/BlackBerry/i); },iOS: function() { return navigator.userAgent.match(/iPhone|iPod/i); },Opera: function() { return navigator.userAgent.match(/Opera Mini/i); },Windows: function() { return navigator.userAgent.match(/IEMobile/i) || navigator.userAgent.match(/WPDesktop/i); },any: function() {return (isMobile.Android() ||isMobile.BlackBerry() ||isMobile.iOS() ||isMobile.Opera() ||isMobile.Windows() ||(navigator.userAgent.toLowerCase().indexOf('macintosh') > -1 &&navigator.maxTouchPoints &&navigator.maxTouchPoints > 1));}};
            function mobileAndTabletCheck() { return isMobile.any(); }
            const game = new CatAdventure("gameCanvas","canvas2d");
            game.start("map.json");
            
            function createZSprite() {
                const canvas = document.createElement("canvas");
                canvas.width = 128;
                canvas.height = 128;

                const ctx = canvas.getContext("2d");
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.font = "bold 80px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                // svart outline
                ctx.lineWidth = 8;
                ctx.strokeStyle = "black";
                ctx.strokeText("Z", 64, 64);

                // vit text
                ctx.fillStyle = "white";
                ctx.fillText("Z", 64, 64);

                const texture = new THREE.CanvasTexture(canvas);
                const material = new THREE.SpriteMaterial({
                    map: texture,
                    transparent: true,
                    depthWrite: false
                });

                const sprite = new THREE.Sprite(material);
                sprite.scale.set(0.5, 0.5, 0.5);
                return sprite;
            }
            
        </script>
        <script>
            (() => {
                const titleScreen = document.getElementById("titleScreen");
                let started = false;
                const beginGame = () => {
                    if (started) return;
                    started = true;
                    window.__catAdventureStarted = true;
                    titleScreen.classList.add("is-starting");
                    titleScreen.removeEventListener("pointerdown", beginGame);
                    titleScreen.removeEventListener("click", beginGame);
                    window.removeEventListener("keydown", beginGame);
                    window.dispatchEvent(new Event("catadventure:start"));
                };
                titleScreen.addEventListener("pointerdown", beginGame, { passive: true });
                titleScreen.addEventListener("click", beginGame);
                window.addEventListener("keydown", beginGame);
            })();
        </script>
    </body>
</html>
