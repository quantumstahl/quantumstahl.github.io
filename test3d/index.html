<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e60000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CatAdventure">
  <title>CatAdventure</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/cat-paw-icon.png">
  <link rel="apple-touch-icon" href="assets/cat-paw-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    { "imports": {
      "three": "https://unpkg.com/three@0.186.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.186.0/examples/jsm/"
    } }
  </script>
</head>
<body class="game-page">
  <canvas id="gameCanvas"></canvas>
  <div id="loadingScreen" class="loading-screen" role="status" aria-live="polite">
    <img class="loading-screen__icon" src="assets/cat-paw-icon.png" alt="">
    <div class="loading-screen__title">CatAdventure</div>
    <div class="loading-screen__message">Loading world…</div>
    <div class="loading-screen__bar" aria-hidden="true"><div></div></div>
  </div>
  <div class="hud"><strong>NextWorld</strong><span id="status">Loading world…</span></div>
  <script type="module" src="js/app/game-main.js"></script>
</body>
</html>
