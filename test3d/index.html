<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b28">
  <title>MaxWorld — Terrain Prototype</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="world-files.css">
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.186.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.186.0/examples/jsm/" } }
  </script>
</head>
<body class="game-page">
  <canvas id="viewport" aria-label="MaxWorld terrain prototype"></canvas>

  <aside id="stats" class="panel panel--stats" aria-live="polite">Starting renderer…</aside>
  <aside id="objectWarnings" class="panel" role="alert" hidden></aside>
  <details id="audioControls" class="panel audio-controls">
    <summary>Audio</summary>
    <label>Master <input type="range" min="0" max="1" step="0.01" data-audio-volume="master" aria-label="Master volume"></label>
    <label>Music <input type="range" min="0" max="1" step="0.01" data-audio-volume="music" aria-label="Music volume"></label>
    <label>Ambient <input type="range" min="0" max="1" step="0.01" data-audio-volume="ambient" aria-label="Ambient volume"></label>
    <label>SFX <input type="range" min="0" max="1" step="0.01" data-audio-volume="sfx" aria-label="Sound effects volume"></label>
  </details>
  <script type="module" src="js/main.js"></script>
</body>
</html>
