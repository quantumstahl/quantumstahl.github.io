<!DOCTYPE html>
<html>
<head>
    <title>MaxPaint3D</title>
    <meta name="viewport" content="user-scalable=no, shrink-to-fit=no viewport-fit=cover">
    <meta charset="utf-8">
    <script src="https://unpkg.com/three@0.140.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.140.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://unpkg.com/three@0.140.0/examples/js/loaders/MTLLoader.js"></script>
    <script src="https://unpkg.com/three@0.140.0/examples/js/exporters/GLTFExporter.js"></script>
    <script src="MaxPaint3D.js"></script>
    <script src="EditorCamera.js"></script>
    <script src="EditorRenderer.js"></script>
    <script src="InputManager.js"></script>
    <script src="ToolManager.js"></script>
    <script src="SelectTool.js"></script>
    <script src="MoveTool.js"></script>
    <script src="joy.js"></script>
    <script src="UI.js"></script>
    <script src="RotateTool.js"></script>
    <script src="ScaleTool.js"></script>
    <script src="UniformScale.js"></script>
    <script src="GroupTool.js"></script>
    <script src="SubgroupTool.js"></script>
    <script src="PivotTool.js"></script>
    <script src="AnimRotateTool.js"></script>
    <script src="SelectSubgroupTool.js"></script>
    <script src="AniMoveTool.js"></script>
    <script src="AniScaleTool.js"></script>
    <script src="gif.js"></script> 
    <script src="gif.worker.js"></script> 
    <script src="PrimSelectTool.js"></script> 
    <script src="FacePaintTool.js"></script> 
    
    <style> 
html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: black;
}

#myCanvas2 {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
}

#myCanvas {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: block;
    background: transparent;
    pointer-events: auto;
  
}
#loadFileInput {
    position: fixed;
    z-index: 10001;

    opacity: 0;
    pointer-events: auto;

    /* viktigt på iPhone */
    display: block;
}
#styleColorInput {
    position: fixed;
    left: 8px;
    top: 8px;
    width: 44px;
    height: 44px;
    opacity: 0.01;
    z-index: 9999;
}
    </style> 
</head>
<body>
    <canvas id="myCanvas2" width="10" height="10" style="border:0px solid black"></canvas>
    <canvas id="myCanvas" width="10" height="10" style="border:0px solid black"></canvas>

   
    <input id="loadFileInput" type="file" accept=".mp3d,application/json">
    <input id="styleColorInput" type="color">
    <input id="textureFileInput" type="file" accept="image/*" >

    <script>
        const isMobile = {
            Android: function() { return navigator.userAgent.match(/Android/i); },
            BlackBerry: function() { return navigator.userAgent.match(/BlackBerry/i); },
            iOS: function() { return navigator.userAgent.match(/iPhone|iPod/i); },
            Opera: function() { return navigator.userAgent.match(/Opera Mini/i); },
            Windows: function() { return navigator.userAgent.match(/IEMobile/i) || navigator.userAgent.match(/WPDesktop/i); },
            any: function() {
                return (
                    isMobile.Android() ||
                    isMobile.BlackBerry() ||
                    isMobile.iOS() ||
                    isMobile.Opera() ||
                    isMobile.Windows() ||
                    (
                        navigator.userAgent.toLowerCase().indexOf('macintosh') > -1 &&
                        navigator.maxTouchPoints &&
                        navigator.maxTouchPoints > 1
                    )
                );
            }
        };

        function mobileAndTabletCheck() { return isMobile.any(); }
        
        if (!mobileAndTabletCheck()) {
            document.getElementById("loadFileInput").style.display = "none";
        }
        
        const canvas = document.getElementById("myCanvas2");
        const canvas2 = document.getElementById("myCanvas");
        const ctx = canvas2.getContext("2d");

        const app = new MaxPaint3D(canvas, canvas2);
        app.init();
    </script>
</body>
</html>
