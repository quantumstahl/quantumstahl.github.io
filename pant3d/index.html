<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MaxPaint3D V4</title>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    { "imports": {
      "three": "https://unpkg.com/three@0.186.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.186.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <header class="editor-bar">
    <strong>MaxPaint3D <span>V4</span></strong>
    <div class="toolbar" aria-label="File actions">
      <button id="newButton" title="New project">New</button>
      <button id="openButton" title="Open a MaxPaint project">Open</button>
      <button id="saveButton" title="Save project">Save</button>
      <button id="exportButton" title="Export selected scene as GLB">Export GLB</button>
      <button id="animationModeButton" title="Enter animation mode">Animate</button>
    </div>
    <i></i>
    <div class="toolbar" aria-label="Editing tools">
      <button data-tool="select" class="is-active">Select</button>
      <button id="selectSubgroupButton" data-tool="selectSubgroup" title="Select the subgroup under the clicked primitive">Select sub</button>
      <button data-tool="translate">Move</button>
      <button data-tool="rotate">Rotate</button>
      <button data-tool="scale">Scale</button>
      <button data-tool="paint" title="Paint an individual face">Paint Face</button>
      <button data-tool="paintPrimitive" title="Paint an individual primitive">Paint Primitive</button>
      <button id="frameButton" title="Frame selected object (F)">Frame</button>
      <label id="paintControls" class="paint-controls" hidden>Paint color <input id="paintColor" type="color" value="#f4d35e"></label>
    </div>
    <i></i>
    <div class="toolbar">
      <button id="undoButton" title="Undo (Ctrl+Z)">Undo</button>
      <button id="redoButton" title="Redo (Ctrl+Shift+Z)">Redo</button>
      <button id="duplicateButton" title="Duplicate selected object (Ctrl+D)">Duplicate</button>
      <button id="resetButton" title="Undo the last transform-gizmo change">Reset gizmo</button>
      <button id="deleteButton" class="danger" title="Delete selected object (Delete)">Delete</button>
    </div>
    <i></i>
    <div class="toolbar snap-tools" aria-label="Snapping">
      <button id="snapButton" title="Toggle transform snapping">Snap</button>
      <label>Step <select id="snapStep"><option value="0.25">0.25</option><option value="0.5">0.5</option><option value="1" selected>1</option><option value="2">2</option></select></label>
    </div>
    <output id="status">Untitled project</output>
  </header>

  <aside class="panel outliner-panel">
    <div class="panel-title">Scene <div class="scene-actions"><button id="groupButton" title="Group selected objects (Ctrl+G)">Group</button><button id="ungroupButton" title="Ungroup the selected group (Ctrl+Shift+G)">Ungroup</button><button id="addMenuButton" title="Add primitive">+ Add</button></div></div>
    <div id="addMenu" class="add-menu" hidden>
      <button data-primitive="cube">Cube</button><button data-primitive="sphere">Sphere</button>
      <button data-primitive="cylinder">Cylinder</button><button data-primitive="cone">Cone</button>
      <button data-primitive="plane">Plane</button>
      <label class="resolution-control">Detail <select id="primitiveResolution"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label>
    </div>
    <output id="exportStats" class="export-stats">GLB estimate: 0 triangles · 0 draw calls</output>
    <div id="outliner" class="outliner"></div>
  </aside>

  <main id="viewport"><canvas id="canvas"></canvas></main>

  <aside class="panel inspector-panel">
    <div class="panel-title">Inspector</div>
    <div id="emptyInspector" class="empty-state">Select an object to edit it.</div>
    <form id="inspector" hidden>
      <label>Name<input id="objectName" type="text"></label>
      <fieldset><legend>Transform</legend>
        <div class="axis-grid"><span>Position</span><label>X<input data-property="position.x" type="number" step="0.1"></label><label>Y<input data-property="position.y" type="number" step="0.1"></label><label>Z<input data-property="position.z" type="number" step="0.1"></label></div>
        <div class="axis-grid"><span>Rotation</span><label>X<input data-property="rotation.x" type="number" step="1"></label><label>Y<input data-property="rotation.y" type="number" step="1"></label><label>Z<input data-property="rotation.z" type="number" step="1"></label></div>
        <div class="axis-grid"><span>Scale</span><label>X<input data-property="scale.x" type="number" min="0.01" step="0.1"></label><label>Y<input data-property="scale.y" type="number" min="0.01" step="0.1"></label><label>Z<input data-property="scale.z" type="number" min="0.01" step="0.1"></label></div>
      </fieldset>
      <fieldset id="materialFields"><legend>Material</legend><label>Color<input id="objectColor" type="color"></label><label>Roughness<input id="objectRoughness" type="range" min="0" max="1" step="0.05"></label><label>Opacity<input id="objectOpacity" type="range" min="0.05" max="1" step="0.05" value="1"></label><label class="check-label"><input id="flatShading" type="checkbox"> Flat shading</label><label>Texture<input id="textureInput" type="file" accept="image/*"></label><span id="textureName" class="texture-name">No texture</span><button id="clearTextureButton" type="button">Remove texture</button></fieldset>
    </form>
  </aside>
  <section id="animationDock" hidden aria-label="Animation timeline"><strong>Animation</strong><select id="animationSelect" aria-label="Saved animation"></select><input id="animationName" aria-label="Animation name" value="Animation 1"><button id="newAnimationButton" type="button">New</button><button id="saveAnimationButton" type="button">Save</button><button id="deleteAnimationButton" type="button">Delete</button><label class="timeline-label">Time <output id="animationTime">0.0s</output><input id="timeline" type="range" min="0" max="2" step="0.1" value="0"></label><label>Duration <input id="animationDuration" type="number" min="0.1" max="60" step="0.1" value="2"></label><label>Preview <select id="playbackMode" aria-label="Animation playback mode"><option value="loop">Loop</option><option value="pingpong">Ping-pong</option></select></label><div class="animation-actions"><button id="keyframeButton" type="button">Set keyframe</button><button id="playButton" type="button">Play</button><button id="clearAnimationButton" type="button">Clear keys</button></div><span id="keyframeSummary" class="texture-name">No keyframes</span></section>
  <input id="fileInput" type="file" accept=".mp3d,.json,application/json" hidden>
  <script type="module" src="app.js"></script>
</body>
</html>
