<!DOCTYPE html>
<html>
<head>
    <title>GameServerClient</title>
    <meta name="viewport" content="user-scalable=no, shrink-to-fit=no">
    <meta charset="utf-8">
    <script src="GameClient.js"></script>
    <script src="ClientApp.js"></script>
    <script src="MapRenderer.js"></script>
    <script src="InputManager.js"></script>
    <script src="ClientGame.js"></script>
     
    
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style> 
        html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}
    </style> 
</head>
<body>
    <canvas id="myCanvas" width="10" height="10" style="border:0px solid black"></canvas>
    
    <div id="hint-pan" style="
            position:fixed; bottom:50%; left:50%; transform:translate(-50%, 50%);
            background:rgba(0,0,0,0.6);
            color:#fff; padding:6px 10px;
            border-radius:6px;
            font:600 50px system-ui, sans-serif;
            text-align:center;
            z-index:2000;
            display:none;

            user-select:none;
            pointer-events:none;
            -webkit-user-select: none;
        ">
    </div>
    
    <script>
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");
     
        const app = new ClientApp();
        app.init();
        showPanHint();
        var audio = new Audio('sounds/song.mp3');
        audio.loop = true;
        const context = new (window.AudioContext || window.webkitAudioContext)();
        const audio2 = async url => {   
        const source = context.createBufferSource(); 
        const audioBuffer = await fetch(url).then(res => res.arrayBuffer()).then(ArrayBuffer => context.decodeAudioData(ArrayBuffer)); 
        source.buffer = audioBuffer;
        source.connect(context.destination);
        source.start();
        };    
        document.addEventListener('click', (event) => {
            try{if(audio.paused){ audio.play();}}catch(error){};
            if(context.state === 'suspended'){context.suspend();context.resume();} 
   
        });
        document.addEventListener("touchstart" , function(e) {
            e.preventDefault();
            try{if(audio.paused){ audio.play();}}catch(error){};
            if(context.state === 'suspended'){context.suspend();context.resume();}           
        });
        document.addEventListener("visibilitychange", event => {
            if (document.visibilityState === "visible") {
                audio.pause();
                audio.src = 'sounds/song.mp3';
                audio.play();
                context.resume();
            }
            else {audio.pause(); audio.src = "";context.suspend();}
        });
        
        function showPanHint(){
            const el = document.getElementById("hint-pan");
            if (el) {
              el.innerText = mobileAndTabletCheck()
                ? "Use two fingers to pan the map"
                : "Use W A S D to move the camera";
              el.style.display = "block";
              setTimeout(()=> el.style.display = "none", 3000);
            }
        } 
        
    </script>
</body>
</html>
